name: Update Wahoo Activities

on:
  schedule:
    - cron: '17 12 * * *' # once daily; access tokens last 2 hours
  workflow_dispatch:

concurrency:
  group: wahoo-update
  cancel-in-progress: false

jobs:
  update-wahoo:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Wahoo Activities
        env:
          WAHOO_CLIENT_ID: ${{ secrets.WAHOO_CLIENT_ID }}
          WAHOO_CLIENT_SECRET: ${{ secrets.WAHOO_CLIENT_SECRET }}
          WAHOO_REFRESH_TOKEN: ${{ secrets.WAHOO_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          decrypt_token() {
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -salt \
              -pass env:WAHOO_CLIENT_SECRET -base64 -A
          }

          encrypt_token() {
            openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt \
              -pass env:WAHOO_CLIENT_SECRET -base64 -A
          }

          REFRESH_TOKEN=""
          if [ -f wahoo-token.enc ]; then
            if REFRESH_TOKEN=$(tr -d '\n\r ' < wahoo-token.enc | decrypt_token); then
              echo "Using encrypted refresh token from the repo"
            else
              echo "Could not decrypt wahoo-token.enc; falling back to GitHub secret"
              REFRESH_TOKEN=""
            fi
          fi

          if [ -z "${REFRESH_TOKEN}" ]; then
            if [ -n "${WAHOO_REFRESH_TOKEN:-}" ]; then
              REFRESH_TOKEN="$WAHOO_REFRESH_TOKEN"
              echo "Using refresh token from GitHub secret"
            else
              echo "No Wahoo refresh token available."
              echo "Set the WAHOO_REFRESH_TOKEN repository secret, then re-run this workflow."
              exit 1
            fi
          fi

          TOKEN_RESPONSE=$(curl -sS -X POST https://api.wahooligan.com/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${WAHOO_CLIENT_ID}" \
            --data-urlencode "client_secret=${WAHOO_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          NEW_REFRESH_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.refresh_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to refresh the Wahoo access token."
            echo "$TOKEN_RESPONSE" | jq -c '{error, error_description, errors}' 2>/dev/null || echo "$TOKEN_RESPONSE"
            echo ""
            echo "Wahoo refresh tokens are single-use. Re-authorize with scripts/wahoo-auth.sh,"
            echo "then update the WAHOO_REFRESH_TOKEN repository secret and delete wahoo-token.enc."
            exit 1
          fi

          # Use the new access token immediately so Wahoo revokes the previous pair.
          HTTP_CODE=$(curl -sS -o wahoo-activities-raw.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.wahooligan.com/v1/workouts?per_page=20")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Workouts request failed with HTTP ${HTTP_CODE}"
            cat wahoo-activities-raw.json
            rm -f wahoo-activities-raw.json
            exit 1
          fi

          jq -e '.workouts | type == "array"' wahoo-activities-raw.json >/dev/null
          jq '.' wahoo-activities-raw.json > wahoo-activities.json
          rm -f wahoo-activities-raw.json

          if [ -n "$NEW_REFRESH_TOKEN" ]; then
            printf '%s' "$NEW_REFRESH_TOKEN" | encrypt_token > wahoo-token.enc
            echo "Saved encrypted refresh token"
          fi

          rm -f wahoo-token.txt

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name 'Wahoo Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add wahoo-activities.json
          if [ -f wahoo-token.enc ]; then
            git add wahoo-token.enc
          fi
          if git ls-files --error-unmatch wahoo-token.txt >/dev/null 2>&1; then
            git rm --cached -f wahoo-token.txt
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git pull --rebase --autostash origin main
          git commit -m "Update Wahoo activities [skip ci]"
          git push origin main
